<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Background -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
      <circle cx="0" cy="0" r="1.2" fill="#38bdf8" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', 'Helvetica Neue', sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .headline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 0.8px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="946" height="296" rx="20" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2" />

  <!-- Grid Overlay -->
  <rect x="4" y="4" width="942" height="292" rx="18" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="850" cy="60" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" />
  <circle cx="120" cy="240" r="130" fill="#6366f1" opacity="0.14" filter="url(#glow)" />
  <circle cx="880" cy="220" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <path d="M 40 40 L 90 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <circle cx="105" cy="40" r="3" fill="#818cf8" />
  <text x="120" y="44" fill="#94a3b8" font-size="12" font-family="'Courier New', Courier, monospace" letter-spacing="2">SYSTEM://PORTFOLIO_V2.0</text>

  <!-- Status indicator badge -->
  <g transform="translate(730, 32)">
    <rect width="180" height="28" rx="14" fill="#032b43" stroke="#0284c7" stroke-width="1" />
    <circle cx="18" cy="14" r="5" fill="#10b981" />
    <circle cx="18" cy="14" r="9" fill="#10b981" opacity="0.3">
      <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="19" fill="#38bdf8" font-size="11" font-weight="600" font-family="-apple-system, sans-serif" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Name -->
  <text x="40" y="125" fill="url(#nameGradient)" font-size="52" class="name-text">HASNAD ULLAH</text>

  <!-- Professional Headline -->
  <text x="42" y="166" fill="#f1f5f9" font-size="20" class="headline-text">
    Python Software Engineer <tspan fill="#38bdf8">|</tspan> Full-Stack Developer <tspan fill="#38bdf8">|</tspan> AI Automation Developer
  </text>

  <!-- Sub-description line -->
  <text x="42" y="200" fill="#94a3b8" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    Specializing in Multi-Agent AI Frameworks, SaaS Clean Architecture, FastAPI, and Computer Vision
  </text>

  <!-- Interactive Badges Pill Row -->
  <g transform="translate(42, 230)">
    <!-- Badge 1: Multi-Agent AI -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" class="badge-text">Multi-Agent Systems</text>
    </g>

    <!-- Badge 2: FastAPI & SaaS -->
    <g transform="translate(195, 0)">
      <rect width="200" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#06b6d4" />
      <text x="32" y="22" fill="#e2e8f0" class="badge-text">FastAPI &amp; SaaS Backends</text>
    </g>

    <!-- Badge 3: Full-Stack React -->
    <g transform="translate(410, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#818cf8" />
      <text x="32" y="22" fill="#e2e8f0" class="badge-text">React &amp; Modern UI</text>
    </g>

    <!-- Badge 4: RAG & LLMs -->
    <g transform="translate(595, 0)">
      <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text x="32" y="22" fill="#e2e8f0" class="badge-text">RAG &amp; Vision AI</text>
    </g>
  </g>

  <!-- Right Decorative Icon/Graphic -->
  <g transform="translate(790, 115)" opacity="0.85">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" />
    <circle cx="60" cy="60" r="32" fill="#0f172a" stroke="#0284c7" stroke-width="1.8" />
    <!-- Python & AI symbol motif -->
    <path d="M 52 46 C 52 42 68 42 68 46 L 68 56 L 56 56 C 52 56 52 60 52 64 L 52 74 C 52 78 40 78 40 74 L 40 60 C 40 52 44 46 52 46 Z" fill="#38bdf8" opacity="0.9" />
    <circle cx="58" cy="49" r="2" fill="#0f172a" />
    <path d="M 68 74 C 68 78 52 78 52 74 L 52 64 L 64 64 C 68 64 68 60 68 56 L 68 46 C 68 42 80 42 80 46 L 80 60 C 80 68 76 74 68 74 Z" fill="#facc15" opacity="0.9" />
    <circle cx="62" cy="71" r="2" fill="#0f172a" />
  </g>
</svg>
